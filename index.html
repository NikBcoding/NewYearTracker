<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Years Planner</title>
  <link rel="stylesheet" href="style.css" /> <!-- css file -->
</head>
<body>
  <main class="page">

    <section class="home-panel">
      <h1 class="main-title">New Years Planner</h1>
      <h2 class="sub-title">Home Page</h2>

      <button class="icon-btn menu-btn">☰</button>
      <button class="icon-btn settings-btn">⚙</button>
      <button class="icon-btn shop-btn">$</button>

      <div class="timer-circle">
        <div id="timerDisplay" class="timer-text">25:00</div>
        <p class="task-text">Do Programming Assignment</p>
      </div>

      <button id="pauseBtn" class="icon-btn pause-btn">⏸</button>
      <button id="playBtn" class="icon-btn play-btn">▶</button>

      <div class="pet-area">  <!-- pet area for animated design -->
        <img
          src="assets/images/pet.png"    
          alt="Pet"
          class="pet-img"
          onerror="this.style.display='none';"
        />
      </div>
    </section>

    <section class="settings-panel">
      <h2 class="settings-title">Settings</h2>

      <div class="settings-grid">
        <div class="left-column">
          <div class="setting-group">
            <label>Username</label>
            <input type="text" placeholder="Enter username" /> 
          </div>

          <div class="setting-group">
            <label>Notification</label>
            <button class="toggle-btn">Off</button>
          </div>

          <div class="setting-group">
            <label>Color Scheme</label>  
            <div class="color-row">
              <div class="color-box pink"></div>
              <div class="color-box orange"></div>
              <div class="color-box blue"></div>
              <div class="color-box magenta"></div>
              <div class="color-box selected">✓</div>
            </div>
          </div>

          <div class="setting-group">
            <label>Sound</label>
            <select>
              <option>Ring</option>
              <option>Bell</option>
            </select>
          </div>

          <div class="setting-group">
            <label>Timer (Minutes)</label>
            <div class="timer-inputs">
              <div>
                <input type="number" value="25" />
                <span>Pomodoro</span>
              </div>
              <div>
                <input type="number" value="15" />
                <span>Long Break</span>
              </div>
              <div>
                <input type="number" value="5" />
                <span>Short Break</span>
              </div>
            </div>
          </div>

          <div class="setting-group">
            <label>Volume</label>
            <input type="range" min="0" max="100" value="20" />
          </div>
        </div>

        <div class="right-column">
          <div class="setting-group">
            <label>Border</label>
            <div class="color-row">
              <div class="color-box selected">✓</div>
              <div class="color-box orange"></div>
              <div class="color-box blue"></div>
              <div class="color-box magenta"></div>
            </div>
          </div>

          <div class="setting-group">
            <label>Pets</label>
            <select>
              <option>Cat</option>  <!-- should only be an option if the own it already -->
              <option>Dog</option>
            </select>
          </div>

          <div class="setting-group">
            <label>Alarm Background</label>
            <select>
              <option>Sky</option>
              <option>Forest</option>
              <option>Stars</option>
            </select>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
