<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="planner-card">
        <h1>New Year Planner</h1>
        <p class="subtitle">Home Page</p>

    <button class="menu-btn">menu</button>
    <button class="settings-btn" id="settingsBtn">settings</button>
    <button class="shop-btn">shop</button>

    <div class="timer">
        <div class="timer-circle">
            <div id="time" class="time"></div>
            <div id="taskText" class="task-text">task in progress...</div>
        </div>
    </div>

    <button class="pause-btn" id="pauseBtn">pause</button>
    <button class="play-btn" id="playBtn">play</button>
     
    <div class="pet">CAT HERE</div>  
</div>

<div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
        <button class="close-btn" id="closeSettingsBtn"> &times;</button>
        <h2>Settings</h2>

        <label for="colorSelect">Color Scheme</label>
        <select id="colorSelect">
            <option value="pink">Pink</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
            <option value="yellow">Yellow</option>
            <option value="purple">Purple</option>
        </select>

        <label for="minuteInput">Timer Minutes</label>
        <input type="number" id="minuteInput" min="1" max="180" value="25">

        <button id="saveSettingsBtn" class="save-settings-btn">Save</button>
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
