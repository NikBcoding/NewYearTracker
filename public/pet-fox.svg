<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 130" width="80" height="130">
  <!-- tail -->
  <path d="M 52 105 Q 80 88 74 60" stroke="#e06010" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- tail tip white -->
  <circle cx="74" cy="60" r="9" fill="#fff5ee"/>
  <!-- body -->
  <ellipse cx="38" cy="95" rx="22" ry="28" fill="#e06010"/>
  <!-- white chest -->
  <ellipse cx="38" cy="100" rx="13" ry="20" fill="#fff5ee"/>
  <!-- left ear -->
  <polygon points="18,36 10,10 32,29" fill="#e06010"/>
  <!-- right ear -->
  <polygon points="58,36 66,10 44,29" fill="#e06010"/>
  <!-- inner left ear -->
  <polygon points="20,33 14,14 30,28" fill="#ffb07a"/>
  <!-- inner right ear -->
  <polygon points="56,33 62,14 46,28" fill="#ffb07a"/>
  <!-- head -->
  <circle cx="38" cy="48" r="24" fill="#e06010"/>
  <!-- white lower face -->
  <ellipse cx="38" cy="58" rx="16" ry="13" fill="#fff5ee"/>
  <!-- left eye -->
  <ellipse cx="29" cy="44" rx="5.5" ry="5.5" fill="#1a1a2e"/>
  <!-- right eye -->
  <ellipse cx="47" cy="44" rx="5.5" ry="5.5" fill="#1a1a2e"/>
  <!-- iris amber left -->
  <ellipse cx="29" cy="44" rx="3.5" ry="4" fill="#c8860a"/>
  <!-- iris amber right -->
  <ellipse cx="47" cy="44" rx="3.5" ry="4" fill="#c8860a"/>
  <!-- pupil left -->
  <ellipse cx="29" cy="44" rx="1.5" ry="3" fill="#0a0a14"/>
  <!-- pupil right -->
  <ellipse cx="47" cy="44" rx="1.5" ry="3" fill="#0a0a14"/>
  <!-- eye shine left -->
  <circle cx="30.5" cy="42" r="1.6" fill="white"/>
  <!-- eye shine right -->
  <circle cx="48.5" cy="42" r="1.6" fill="white"/>
  <!-- nose -->
  <ellipse cx="38" cy="55" rx="4" ry="3" fill="#1a1a2e"/>
  <!-- nose shine -->
  <circle cx="36.5" cy="53.5" r="1.2" fill="#555"/>
  <!-- mouth -->
  <path d="M34 58 Q38 62 42 58" stroke="#904010" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- cheek markings -->
  <circle cx="23" cy="54" r="5.5" fill="#ff9040" opacity="0.4"/>
  <circle cx="53" cy="54" r="5.5" fill="#ff9040" opacity="0.4"/>
  <!-- whiskers left -->
  <line x1="11" y1="52" x2="30" y2="55" stroke="#c8a090" stroke-width="1.2"/>
  <line x1="11" y1="57" x2="30" y2="57" stroke="#c8a090" stroke-width="1.2"/>
  <!-- whiskers right -->
  <line x1="65" y1="52" x2="46" y2="55" stroke="#c8a090" stroke-width="1.2"/>
  <line x1="65" y1="57" x2="46" y2="57" stroke="#c8a090" stroke-width="1.2"/>
  <!-- front left paw -->
  <ellipse cx="28" cy="120" rx="10" ry="7" fill="#e06010"/>
  <!-- front right paw -->
  <ellipse cx="48" cy="120" rx="10" ry="7" fill="#e06010"/>
  <!-- paw toes left -->
  <ellipse cx="23" cy="122" rx="3" ry="2" fill="#b04c08"/>
  <ellipse cx="28" cy="124" rx="3" ry="2" fill="#b04c08"/>
  <ellipse cx="33" cy="122" rx="3" ry="2" fill="#b04c08"/>
  <!-- paw toes right -->
  <ellipse cx="43" cy="122" rx="3" ry="2" fill="#b04c08"/>
  <ellipse cx="48" cy="124" rx="3" ry="2" fill="#b04c08"/>
  <ellipse cx="53" cy="122" rx="3" ry="2" fill="#b04c08"/>
</svg>
