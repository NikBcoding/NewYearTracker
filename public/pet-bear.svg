  <!-- mouth -->
  <path d="M33 61 Q38 66 43 61" stroke="#5a2a0a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="24" cy="60" r="7" fill="#c4845f" opacity="0.45"/>
  <circle cx="52" cy="60" r="7" fill="#c4845f" opacity="0.45"/>
