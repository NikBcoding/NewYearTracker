  <circle cx="18" cy="33" r="15" fill="#8b5a2b"/>
  <!-- right outer ear -->
  <circle cx="58" cy="33" r="15" fill="#8b5a2b"/>
  <!-- left inner ear -->
  <circle cx="18" cy="33" r="9" fill="#c4845f"/>
  <!-- right inner ear -->
  <circle cx="58" cy="33" r="9" fill="#c4845f"/>
