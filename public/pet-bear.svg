  <!-- paw toes left -->
  <circle cx="20" cy="122" r="3" fill="#5a3010"/>
  <circle cx="26" cy="125" r="3" fill="#5a3010"/>
  <circle cx="32" cy="122" r="3" fill="#5a3010"/>
  <!-- paw toes right -->
  <circle cx="44" cy="122" r="3" fill="#5a3010"/>
  <circle cx="50" cy="125" r="3" fill="#5a3010"/>
  <circle cx="56" cy="122" r="3" fill="#5a3010"/>
