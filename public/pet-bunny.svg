  <ellipse cx="33" cy="122" rx="3" ry="2" fill="#ddd"/>
  <!-- paw toes right -->
  <ellipse cx="43" cy="122" rx="3" ry="2" fill="#ddd"/>
  <ellipse cx="48" cy="124" rx="3" ry="2" fill="#ddd"/>
  <ellipse cx="53" cy="122" rx="3" ry="2" fill="#ddd"/>
  <!-- fluffy tail -->
