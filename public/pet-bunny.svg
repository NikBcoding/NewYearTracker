  <!-- left ear inner -->
  <ellipse cx="26" cy="23" rx="5.5" ry="18" fill="#ffb3c6"/>
  <!-- right ear inner -->
  <ellipse cx="54" cy="23" rx="5.5" ry="18" fill="#ffb3c6"/>
  <!-- body -->
  <ellipse cx="38" cy="95" rx="24" ry="28" fill="#f0f0f0"/>
